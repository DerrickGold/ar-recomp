# Per-room diorama layer overrides.
# Section is [layers:GG:MM] with $18/$19 in hex.
# Keys: order:<slot>  z:<depth>  alpha:<0-255>
#       rake:<-1..1>  thick:<0..1>  stack:<0..1> copies:<1..8>
#
# Three shapes close the void that opens between two parallel planes once the
# diorama camera tilts. They are different shapes, not spellings of one:
#
#   rake  tilts the plane: top edge keeps z, bottom edge sits at z+rake.
#         Right for a surface that genuinely recedes -- water, a floor.
#         COST: tilting puts the layer's own rows at DIFFERENT depths, so the
#         perspective divide gives one layer two parallax rates and it shears as
#         the camera moves -- that layer's parallax reads over-exaggerated. This
#         is intrinsic to tilting, not a tuning error. Prefer stack if it shows.
#
#   thick extrudes the plane's BOTTOM edge forward to z+thickness, adding a near
#         face below it while the plane's own art stays square to the camera.
#         Right for something whose front should stay flat -- a rock wall, a
#         building. The skirt repeats the plane's bottom source row, shaded
#         darker with depth, because a flat 2D capture has no side-face art.
#
#   stack fills the gap with `copies` PARALLEL repeats of the whole layer, laid
#         from z toward z+stack, fading and darkening with depth. Nothing tilts,
#         so every copy has ONE depth and one parallax rate and the layer keeps
#         the flat poster-like motion the diorama is built on.
#         COST: copies are discrete, so gaps remain BETWEEN slices; more copies
#         close them at one extra draw call each (cap 8).
#         Right for anything whose real form is many similar things at different
#         depths -- foliage, crowds, rain, cloud banks, rubble.
#
# All three compose. A stack keeps every copy on the same rake, and a skirt
# starts at the raked bottom edge, so authoring several does not tear at a fold.

[layers:01:02]        ; Fillmore act 2
bg2hi = rake:0.29     ; water (z=0.21) floods forward to meet the rock path (z=0.50)
;bg2hi = stack:0.29 copies:4  ; same gap, no tilt -- try this if the rake's
                              ; parallax reads exaggerated as the camera moves
;bg1 = thick:0.20             ; or give the rock path a solid near face
