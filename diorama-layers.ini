# Diorama per-room layer overrides.
# Section is [layers:GG:MM] with $18/$19 in hex. A named camera-local
# refinement uses [layers:GG:MM:waterfall] and inherits the base room first.
# Keys are
#   order:<slot>  z:<depth>  alpha:<0-255>  rake:<-1..1>  bow:<-1..1>  thick:<0..1>
#   stack:<0..1>  copies:<1..8>  density:<per unit>  dir:<forward|backward|both>
#   voxel:<0..1>  slices:<2..24>
# Base BG1/BG2 accept `transparent:black` or `transparent:cgram-XX`. The
# complete low plane is filled first, including untiled areas, then the tiles
# paint over it. Mirror/repeat/clamp remain tile policies and the high-priority
# band stays sparse. The Layers menu offers a live 16x16 CGRAM picker.
# Named ROM BG skyboxes use the same fill-then-paint rule.
# Action BG virtual depth bands use `bg1-virtual` / `bg2-virtual` records in
# the same room section. Band 0 is the new far plane, band 1 the ordinary BG
# plane, and band 2 its priority-1 plane. Cell rectangles override metatile
# rules; the ROM priority bit remains the fallback. The virtual plane itself
# accepts z/order/alpha:
#   bg1-virtual = z:0.35 order:4 alpha:255
#   bg1-virtual = metatile:23 band:0
#   bg1-virtual = cells:4,5-12,5 band:2
# Backdrop's source key selects the Diorama SKYBOX: source:captured uses the
# current room's BG2, while source:rom-GG-MM-bgN (N=1/2) HLE-decodes that
# action room's first BG page directly from the cartridge. It is visible when
# the global skybox mode is enabled and does not depend on room visit order.
# Backdrop alpha/z/order still control only the residual in-box plane;
# alpha:0 disables that plane without disabling a selected skybox source.
# rake tilts a plane in depth (top keeps z, bottom sits at z+rake);
# bow is the same tilt EASED, so the top keeps its original depth and
# only the bottom bends forward -- try bow first if a rake reads too
# strong.
# which closes the void between two parallel planes at a tilted
# camera. thick extrudes the plane's BOTTOM edge forward to
# z+thickness instead, so the layer reads as a block with a near
# face while its own art stays square to the camera. stack fills the
# gap with PARALLEL repeats -- unlike rake it never tilts, so the
# layer keeps one parallax rate. dir picks which side of the plane to
# fill (forward = toward the camera, the default); density sets slices
# per unit depth so spacing stays consistent across rooms. voxel is a
# dense unfaded stack: it extrudes the layer as one SOLID object and,
# unlike thick, respects the art's silhouette. All compose.
# IMPORTANT: thick/stack/voxel issue extra geometry draws. Do not use them on
# a plane currently resolved as an additive subscreen source: ADD is applied to
# every draw, so overlapping copies compound and clip. z/rake/bow remain
# single-draw shapes. Correct multi-draw support needs the shape flattened to
# an intermediate target and additively composited exactly once.

[layers:01:02]
bg2hi = z:0.5 alpha:160 stack:0.29 copies:4 dir:backward


