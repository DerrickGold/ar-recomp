# Diorama per-room layer overrides.
# Section is [layers:GG:MM] with $18/$19 in hex; keys are
#   order:<slot>  z:<depth>  alpha:<0-255>  rake:<-1..1>  bow:<-1..1>  thick:<0..1>
#   stack:<0..1>  copies:<1..8>  density:<per unit>  dir:<forward|backward|both>
#   voxel:<0..1>  slices:<2..24>
# rake tilts a plane in depth (top keeps z, bottom sits at z+rake);
# bow is the same tilt EASED, so the top keeps its original depth and
# only the bottom bends forward -- try bow first if a rake reads too
# strong.
# which closes the void between two parallel planes at a tilted
# camera. thick extrudes the plane's BOTTOM edge forward to
# z+thickness instead, so the layer reads as a block with a near
# face while its own art stays square to the camera. stack fills the
# gap with PARALLEL repeats -- unlike rake it never tilts, so the
# layer keeps one parallax rate. dir picks which side of the plane to
# fill (forward = toward the camera, the default); density sets slices
# per unit depth so spacing stays consistent across rooms. voxel is a
# dense unfaded stack: it extrudes the layer as one SOLID object and,
# unlike thick, respects the art's silhouette. All compose.
# IMPORTANT: thick/stack/voxel issue extra geometry draws. Do not use them on
# a plane currently resolved as an additive subscreen source: ADD is applied to
# every draw, so overlapping copies compound and clip. z/rake/bow remain
# single-draw shapes. Correct multi-draw support needs the shape flattened to
# an intermediate target and additively composited exactly once.

