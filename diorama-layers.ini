# Per-room diorama layer overrides.
# Section is [layers:GG:MM] with $18/$19 in hex.
# Keys: order:<slot>  z:<depth>  alpha:<0-255>  rake:<-1..1>  thick:<0..1>
#   rake  tilts a plane in depth: top edge keeps z, bottom edge sits at z+rake.
#   thick extrudes the plane's BOTTOM edge forward to z+thickness, adding a near
#         face below it while the plane's own art stays square to the camera.
#
# rake vs thick: both close the void that opens between two parallel planes once
# the camera tilts, but they are different shapes, not two spellings of one.
#   rake  stretches the layer's art in depth and stops it facing the camera.
#         Right for a surface that genuinely recedes -- water, a floor.
#   thick leaves the art untouched and adds geometry below the plane. Right for
#         something whose front should stay flat -- a rock wall, a building.
#         The skirt repeats the plane's bottom source row, shaded darker with
#         depth, because a flat 2D capture has no side-face art to sample.
# They compose: the skirt starts at the raked bottom edge, so authoring both
# does not tear at the fold.

[layers:01:02]        ; Fillmore act 2
bg2hi = rake:0.29     ; water (z=0.21) floods forward to meet the rock path (z=0.50)
;bg1 = thick:0.20     ; uncomment to give the rock path a near face instead
