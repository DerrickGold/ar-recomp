# snesbuild.ini — game-side build manifest for snesbuild's hermetic
# (CMake-free) build path: `snesbuild build --hermetic`.
#
# This lists only what the engine cannot know about this game. The shared
# runtime source list lives in snesrecomp-go/runtime/runner.cmake (parsed
# directly by snesbuild), and generated sources are globbed from src/gen.
# This file is the SINGLE game source list: CMakeLists.txt (the developer +
# test build) reads these `source =` lines directly via file(STRINGS), so there
# is no second list to keep in sync. Add or remove a game .c here and both
# builds follow.

[project]
name = ActRaiserRecomp
# gnu11, not c11: CMAKE_C_STANDARD 11 leaves C_EXTENSIONS ON, so the developer
# build compiles as -std=gnu11. Strict -std=c11 defines __STRICT_ANSI__, and
# glibc then hides POSIX declarations (popen/fileno/dup2 in src/run_dir.c),
# which breaks the Linux hermetic build while macOS silently tolerates it.
std = gnu11
sdl3 = true
link = -lm

define = SYSTEM_VOLUME_MIXER_AVAILABLE=0
define = SNESRECOMP_TRACE=0
define = SNESRECOMP_REVERSE_DEBUG=0

include = .
include = src
include = recomp
include = third_party/stb

source = src/config.c
source = src/quintet_lzss.c
source = src/settings.c
source = src/randomizer.c
source = src/settings_overlay.c
source = src/settings_overlay_debug_panel.c
# In-game manual, all three of it: the page/kinematics arithmetic, the input and
# decode-budget policy, and the host shim that owns the file and the textures.
# Added together because until the shim existed nothing in the game called the
# other two, and listing them alone would have compiled dead code into the
# shipped binary. ALL THREE, though -- the shim calls into both of the others,
# so omitting either is a link error and not a smaller build.
source = src/manual/manual_pages.c
source = src/manual/manual_input.c
source = src/manual/manual_reader.c
source = src/input_map.c
source = src/camera_orbit.c
source = src/dev/scene_inspector.c
