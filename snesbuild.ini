# snesbuild.ini — game-side build manifest for snesbuild's hermetic
# (CMake-free) build path: `snesbuild build --hermetic`.
#
# This lists only what the engine cannot know about this game. Release bundles
# link the target archive under snesrecomp-go/runtime/lib; source checkouts fall
# back to the shared list in runtime/runner.cmake. Generated sources are
# globbed from src/gen in both cases.
# This file is the SINGLE game source list: CMakeLists.txt (the developer +
# test build) reads these `source =` lines directly via file(STRINGS), so there
# is no second list to keep in sync. Add or remove a game .c here and both
# builds follow.

[project]
name = ActRaiserRecomp
# gnu11, not c11: CMAKE_C_STANDARD 11 leaves C_EXTENSIONS ON, so the developer
# build compiles as -std=gnu11. Strict -std=c11 defines __STRICT_ANSI__, and
# glibc then hides POSIX declarations (popen/fileno/dup2 in src/run_dir.c),
# which breaks the Linux hermetic build while macOS silently tolerates it.
std = gnu11
sdl3 = true
link = -lm
# Desktop enhanced text uses SDL3_ttf behind the portable text-backend ABI.
# Ports can replace this binding without changing localization/session code.
link = -lSDL3_ttf

define = SYSTEM_VOLUME_MIXER_AVAILABLE=0
define = SNESRECOMP_TRACE=0
define = SNESRECOMP_REVERSE_DEBUG=0
# Release bundles build through this CMake-free manifest. Keep the shipped
# feature contract explicit here rather than relying on CMake's default.
define = AR_SIM3D_TERRAIN_ELEVATION=1
define = AR_HAS_SDL3_TTF=1

include = .
include = src
include = recomp
include = third_party/stb
include = third_party/sheenbidi/Headers
include = third_party/sheenbidi/Source
# Separate translation units let the Go incremental builder track every source
# change; the upstream unity file includes .c files which its header scan omits.
source = third_party/sheenbidi/Source/API/SBAlgorithm.c
