# SPC700 upload routine at $02:9A56.
# Loops on $2140 waiting for APU handshake (0xBBAA), then uploads
# data blocks through the IPL protocol. Replace with framework HLE.
hle_spc_upload 9964
hle_spc_upload 9A56

# VBlank wait subroutine at $02:A85E — identical pattern to $00:8418
# (PHP/SEP/PHA, spin on $4210 bit 7, PLA/PLP/RTS). Used during the
# intro sequence. Must yield to the host so frames are drawn and the
# NMI handler runs each frame; otherwise it busy-spins forever.
hle_func A85E ActRaiser_WaitForVblank

# Tile-animation frame scheduler at $02:BC56. During a force-blanked scene
# load, the recomp's main coroutine can wait several host frames for the SPC
# $F0 acknowledgement while NMI keeps running. Native BC56 then arms a DMA
# from the not-yet-captured $7F:B800 page, erasing VRAM $0000 before $BAF5
# captures the animation frames. The HLE faithfully reproduces BC56 but
# defers invisible animation ticks while INIDISP force-blank is set.
hle_func BC56 ActRaiser_TileAnimationTick

# Action camera application. Native $02:B030 first computes the tracked-subject
# request in $7C/$7E. This seam then clamps BG1 against $2E/$30 for its native
# 256x225 viewport and derives BG2 parallax and player-relative coordinates.
# The faithful HLE preserves that complete tail and the original clamp in 4:3,
# Wide Raw, and undersized rooms. Corrected action-wide modes inset the bounds
# by the requested presentation margins when the current room can contain the
# complete view, so the finite map edge reaches the outer canvas edge instead
# of cutting off beside a collapsed margin. The canonical ActionBgPlan canvas
# owner and provider-enable gate exclude authored hub/final scenes and the
# explicit native A/B. AR_WS_ACTION_CAMDBG=1 reports the live interval.
hle_func B091 ActRaiser_UpdateActionCamera

# The column/row metatile expanders are bounded 16-iteration leaves with four
# direct callers each and no branch entry into either body. Their one shared
# wrapper retains the distinct output geometry, DP countdown/descriptors,
# stack bytes, decimal-mode column source advance, registers/flags, and RTS.
# Tile-word mask/attribute composition is shared with every host decoder.
hle_func B90D ActRaiser_ExpandActionBgMetatileColumn
hle_func B95A ActRaiser_ExpandActionBgMetatileRow

# Quintet LZSS decompressor used by the bounded asset loaders. The shared host
