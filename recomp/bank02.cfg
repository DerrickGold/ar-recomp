# bank02.cfg — ActRaiser (USA)
#
# Auto-generated minimal config. The recompiler will auto-discover
# functions via cross-bank JSL targets from other banks.

bank = 2

# Accepted campaign entry, not merely highlighting a title option. Delegate
# original menu/fades/Continue restore, then bind the per-save host session.
hle_func_if A622 ActRaiser_RegionalTitle ActRaiser_RegionalTitleEntry
# Accepted Continue, before native SRAM restoration. Host acknowledgement can
# cancel back into the same title frame; record/replay retains the native path.
func bank_02_A75B A75B end:A79F entry_mx:1,0
func bank_02_A79F A79F end:A7A3 entry_mx:1,0
func bank_02_A7A3 A7A3 entry_mx:1,0
hle_func_if A79F ActRaiser_RegionalContinue ActRaiser_RegionalContinueEntry

# Native BG3 clears, ordered with fixed-text composition. Read-only observers.
hle_func_if ABC4 ActRaiser_LocalizationTextObserverTrap ActRaiser_LocalizationObserveGeneralClear
hle_func_if BA41 ActRaiser_LocalizationTextObserverTrap ActRaiser_LocalizationObserveHudTemplate

# Credits identity comes from the native page argument, then becomes visible
# only when the copied map reaches BG3. A85E observes copy completion before
# yielding; AEEB delegates the untouched native DMA body before publishing it.
hle_func_if AB30 ActRaiser_LocalizationTextObserverTrap ActRaiser_CreditsObserveSelection
# The same DMA commits HUD ownership on every top-row upload, including F1=0.
hle_func_if AEEB ActRaiser_Bg3Upload ActRaiser_Bg3UploadEntry

# Read-only observation of the fixed BG3 text composer. A is the row/column
# destination and DB:Y is the source. The predicate never replaces the native
# routine; it only supplies semantic routing evidence to the game thread.
hle_func_if BF60 ActRaiser_LocalizationTextObserverTrap ActRaiser_LocalizationObserveTextCompose
# The inverse record eraser closes small windows without composing a new
# heading or clearing the whole screen (notably the shared YES/NO menu).
hle_func_if C1B7 ActRaiser_LocalizationTextObserverTrap ActRaiser_LocalizationObserveTextErase

# SPC700 upload routine at $02:9A56.
# Loops on $2140 waiting for APU handshake (0xBBAA), then uploads
# data blocks through the IPL protocol. Replace with framework HLE.
hle_spc_upload 9964
hle_spc_upload 9A56

# VBlank wait subroutine at $02:A85E — identical pattern to $00:8418
# (PHP/SEP/PHA, spin on $4210 bit 7, PLA/PLP/RTS). Used during the
# intro sequence. Must yield to the host so frames are drawn and the
# NMI handler runs each frame; otherwise it busy-spins forever.
hle_func A85E ActRaiser_WaitForVblank

# Tile-animation frame scheduler at $02:BC56. During a force-blanked scene
# load, the recomp's main coroutine can wait several host frames for the SPC
# $F0 acknowledgement while NMI keeps running. Native BC56 then arms a DMA
# from the not-yet-captured $7F:B800 page, erasing VRAM $0000 before $BAF5
# captures the animation frames. The HLE faithfully reproduces BC56 but
# defers invisible animation ticks while INIDISP force-blank is set.
hle_func BC56 ActRaiser_TileAnimationTick

# Action camera application. Native $02:B030 first computes the tracked-subject
# request in $7C/$7E. This seam then clamps BG1 against $2E/$30 for its native
# 256x225 viewport and derives BG2 parallax and player-relative coordinates.
# The faithful HLE preserves that complete tail and the original clamp in 4:3,
# Wide Raw, and undersized rooms. Corrected action-wide modes inset the bounds
# by the requested presentation margins when the current room can contain the
# complete view, so the finite map edge reaches the outer canvas edge instead
# of cutting off beside a collapsed margin. The canonical ActionBgPlan canvas
# owner and provider-enable gate exclude authored hub/final scenes and the
# explicit native A/B. AR_WS_ACTION_CAMDBG=1 reports the live interval.
hle_func B091 ActRaiser_UpdateActionCamera

# The column/row metatile expanders are bounded 16-iteration leaves with four
# direct callers each and no branch entry into either body. Their one shared
# wrapper retains the distinct output geometry, DP countdown/descriptors,
# stack bytes, decimal-mode column source advance, registers/flags, and RTS.
# Tile-word mask/attribute composition is shared with every host decoder.
hle_func B90D ActRaiser_ExpandActionBgMetatileColumn
hle_func B95A ActRaiser_ExpandActionBgMetatileRow

# Quintet LZSS decompressor used by the bounded asset loaders. The shared host
# decoder is byte-exact across all 49 action-map scripts and the dialog font;
# this CPU wrapper additionally preserves the $A5/$AE/$AF/$B1/$B7 scratch,
# $7E:2000 dictionary, P/DB/X/Y, accumulator, and RTL stack contract.
hle_func C5C9 ActRaiser_LzssDecompress

# Action-only command-7/6 video staging. The guards admit the audited
# compressed CHR/font uploads and 128-byte palette slices, including their
# exact script cursor, PPU-port, workspace, scratch and CPU contracts. Raw
# title/SIM shapes and unexpected action operands retain the native bodies.
hle_func_if B28E ActRaiser_LoadActionCharacters ActRaiser_ActionCharacterLoadHleEnabled
hle_func_if B330 ActRaiser_LoadActionPalette ActRaiser_ActionPaletteLoadHleEnabled

# Action-only command-3 video-profile staging. The guarded HLE applies the
# audited 28-byte action records to the same PPU ports and direct-page render
# state. Title/SIM, unexpected profile IDs, and unsupported CPU modes retain
# the generated native body. The wrapper resolves the campaign's initial room
# time only after normal completion. AR_ACTION_ROOM_VIDEO_HLE=0 delegates all
# video/register work to native code, retaining the selected gameplay timer.
hle_func_if B4E8 ActRaiser_RunActionVideoConfig ActRaiser_ActionVideoConfigEntry

# Action-only command-5/4 asset staging. The predicates admit exactly the
# audited compressed BG1/BG2 shapes used by all 49 action rooms; title/SIM,
# raw, BG3, and any unexpected shape execute the decoded native bodies. This
# keeps the rest of $B1F7's command VM native while moving the collision and
# renderer-visible background data plane behind independently tested HLEs.
hle_func_if B363 ActRaiser_LoadActionMetatiles ActRaiser_ActionMetatileLoadHleEnabled
hle_func_if B3EB ActRaiser_LoadActionMap ActRaiser_ActionMapLoadHleEnabled

# --- $02:AA9C = the ENDING/CREDITS presenter (found 2026-07-14) ------------
# Mode $18=$08 (the ending, entered after the post-final-boss $19=09
# world-montage) is started by the bank-0 fade routine's special case at
# $00:82C3: `LDA $18; CMP #$08; BNE ...; LDA #$02; PHA; LDX #$AA9B; PHX; RTL`
# — a hand-rolled cross-bank RTL long-jump (the JSL-less sibling of the
# PHA;RTS trick; the only site of this byte shape in bank 0). $02:AA9C was
# completely unconverted (no func, no label), so the dispatch missed and
# host-unwound PAST the whole ending: the game sat alive in mode 8 with only
# NMI frames running and no credits (runs/20260714-184728, dispmiss
# `from 0082D0 to 02AA9C` at hf=47576).
# The routine relocates S to $01FF (never returns -> registration is the
# dispatch-only/tail-jump class, no paired-resume hazard), walks a 17-entry
# sequence via JSR $AB30, checks $0349, and stamps 'A','C','T' into SRAM
# $70:1FF0-1FF2 (the beat-the-game save marker). Site executes at m=1,x=0
# (first insn REP #$20 -> m=0). Its JSR callees ($AB30 etc.) auto-promote
# through the regen closure.
func bank_02_AA9C AA9C entry_mx:1,0

# I02: only the two action-lives glyph bytes. The shared writer retains its
# native attributes, other HUD fields, return frame, and actual life stock.
func bank_02_C206 C206 end:C280 entry_mx:0,0 entry_mx:0,1 entry_mx:1,0 entry_mx:1,1
func bank_02_C280 C280 end:C2A4 entry_mx:0,0
func bank_02_C2A4 C2A4 entry_mx:1,0
hle_func_if C280 ActRaiser_RegionalLivesDisplay ActRaiser_RegionalLivesDisplayEntry
