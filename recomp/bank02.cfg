# $7E:2000 dictionary, P/DB/X/Y, accumulator, and RTL stack contract.
# Completed decodes also notify host-only actor-art residency; overlapping
# images are not exclusive 4 KiB allocations. No native bytes are replaced.
hle_func C5C9 ActRaiser_LzssDecompress

