<meta charset="utf-8">
<title>Action Layer Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#12141a; --panel:#1a1d26; --panel-2:#212533; --sunk:#0d0f14;
  --line:#2b3040; --line-soft:#232838;
  --ink:#e8ebf2; --dim:#9aa3b8; --faint:#6b7489;
  --accent:#5aa9ff; --accent-dim:#1d3a5c;
  --behind:#7c5cff;   /* far virtual plane */
  --plane:#3d8f6b;    /* behind, same plane (default) */
  --ahead:#e0913a;    /* ahead of objects */
  --warn:#e0655a;--no-soft:#3a1d1c;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:13px;overflow:hidden}
button,select,input{font-family:inherit;font-size:12px;color:var(--ink)}
button,.file-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:5px 10px;cursor:pointer}
button:hover,.file-btn:hover{background:#2a3042;border-color:#3a4156}
.file-btn{display:inline-block;line-height:normal;color:var(--ink);font-size:12px;text-decoration:none}
.file-btn[aria-disabled=true]{opacity:.4;cursor:default}
button.on{background:var(--accent-dim);border-color:var(--accent);color:#cfe4ff}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--panel-2);border-color:var(--line)}
button:focus-visible,select:focus-visible,.file-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.side input[type=number],#settingsContent input[type=number]{background:var(--sunk);
  color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px;max-width:90px}
.app{display:grid;grid-template-columns:224px 1fr;height:100vh}
.app.sidebar-hidden{grid-template-columns:1fr}
.app.tools-hidden #toolbarExtras,.app.tools-hidden #selectionTools{display:none}
.app.tools-hidden .project-status{padding-top:3px;padding-bottom:3px}
.section-toggle{width:100%;margin-top:8px;font-size:11px}
.side{background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
.side-section{margin-top:14px;padding-top:9px;border-top:1px solid var(--line)}
.side-section summary{cursor:pointer;color:var(--dim);font-size:11px;font-weight:600}
.side-section summary:hover{color:var(--ink)}
.side-section summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.side>.side-section:not([data-settings=room]){display:none}
.workspace-shortcuts{border-top:1px solid var(--line);margin-top:22px;padding-top:5px}
.workspace-shortcuts h2{margin-bottom:10px}
.workspace-shortcuts button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:4px 0;padding:9px 7px;background:transparent;border-color:transparent}
.workspace-shortcuts button:hover{background:var(--panel-2);border-color:var(--line)}
.workspace-shortcuts span{color:var(--faint);font-size:16px}
.room-details{margin-top:14px}.room-details>summary{font-size:10px;font-weight:400}
.coverage-panel{margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:5px}
.coverage-panel summary{font-size:11px;color:var(--dim);cursor:pointer}
.coverage-panel .bg-policy .ctl select{flex:1;min-width:0}
.bg-policy .ctl input{width:55px;min-width:0}
.bg-policy button{margin:3px 0}
.bg-policy #bgPolicyDrafts{color:#f0c55a}
.bg-policy-band{border:1px solid var(--line);margin:8px 0;padding:8px}
.bg-policy-band label{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0;font-size:10px}
.bg-policy-band select{max-width:160px}.bg-policy-band input{width:64px}
.ctl{margin-top:7px}
.coverage-panel select{flex:1;min-width:0;font-size:10px}
.coverage-panel input[type=number]{width:70px;background:var(--sunk);border:1px solid var(--line);padding:4px}
.coverage-summary{font-size:11px;line-height:1.5;color:#76d19c;margin:8px 0 0}
.coverage-summary.short{color:#f48c7f}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.workspace-bar{gap:6px;padding:10px 12px}
.workspace-modes,.workspace-history{display:flex;gap:3px;align-items:center}
.workspace-modes{border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--sunk)}
.workspace-modes button{border-color:transparent;background:transparent}
.workspace-modes button.on{border-color:var(--accent);background:var(--accent-dim)}
.workspace-history button{font-size:19px;line-height:20px;padding:3px 8px}
.primary-action{border-color:var(--accent);background:var(--accent-dim)}
.toolbar-popover{position:relative;flex:none}
.toolbar-popover>summary{list-style:none;cursor:pointer;padding:6px 9px;border:1px solid var(--line);border-radius:5px;font-size:12px;background:var(--panel-2)}
.toolbar-popover>summary::-webkit-details-marker{display:none}
.toolbar-popover>summary::after{content:'⌄';margin-left:7px;color:var(--dim)}
.toolbar-popover>summary:hover,.toolbar-popover[open]>summary{border-color:var(--accent)}
.toolbar-popover.active>summary{color:#cfe4ff;background:var(--accent-dim)}
summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar-popup{position:absolute;z-index:30;left:0;top:calc(100% + 7px);width:310px;max-width:calc(100vw - 24px);max-height:65vh;overflow:auto;background:var(--panel);border:1px solid #3a4156;border-radius:8px;box-shadow:0 12px 36px #000a;padding:12px}
.popup-end>.toolbar-popup{left:auto;right:0}
.toolbar-popup>button{display:block;width:100%;text-align:left;margin:5px 0}
.toolbar-popup>label,.toolbar-popup .popup-section>label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;font-size:11px}
.toolbar-popup label:has(input[type=checkbox]){justify-content:flex-start}
.toolbar-popup label input[type=range]{min-width:0;flex:1;max-width:200px}
.toolbar-popup h3{margin:12px 0 8px;font-size:11px;color:var(--dim)}
.toolbar-popup h3:first-child{margin-top:0}
.toolbar-popup hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.toolbar-popup .hint{line-height:1.5}
.popup-row{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.popup-section{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.popup-section>summary{cursor:pointer;font-size:11px;color:var(--dim)}
.popup-section[open]>summary{margin-bottom:10px;color:var(--ink)}
.toolbar-popup .change-review{padding:0;border:0;background:transparent}
.toolbar-popup .change-review #changeSummary{flex-basis:100%;line-height:1.5}
.toolbar-popup .change-review #highlightSummary{flex-basis:100%}
.shared-toolbar{min-height:50px;background:#171d29}
.shared-toolbar>label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
.renderer-status{display:none;font:10px/1.5 var(--mono);color:var(--dim);width:100%}
.show-scene-info .renderer-status,.renderer-status.error{display:block}
.renderer-status.error{color:#ffb4a9}
.settings-search{display:flex;align-items:center;gap:10px;padding:0 20px 14px;flex-wrap:wrap}
.settings-search label{color:var(--dim);font-size:11px}
.settings-search input{flex:1;min-width:180px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:8px;color:var(--ink)}
#settingsEmpty{font-size:11px;color:var(--dim)}
[hidden]{display:none!important}
.selection-tools{padding:9px 12px;background:#171d29;border-bottom:1px solid var(--line)}
.selection-summary,.selection-actions,.selection-detail,.change-review{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selection-summary{font-size:11px;color:var(--dim);margin-bottom:7px}
.selection-summary b{color:var(--ink)}
#selectionScope{margin-left:auto;color:var(--accent);font-family:var(--mono);font-size:10px}
.selection-actions{gap:5px}
.selection-detail{font-size:10px;color:var(--faint);margin-top:7px;line-height:1.5}
#activeTool{color:var(--dim);font-weight:500}
.change-review{padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:11px}
#changeSummary{color:#f0c55a;margin-right:auto}
.change-review button{font-size:10px;padding:4px 8px}
.change-review select{font-size:10px;padding:4px 6px}
#highlightSummary{color:var(--dim);font-size:10px}
.save-state{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:4px 7px}
.save-state.dirty{color:#f0c55a;border-color:#69552b;background:#302916}
.project-status{margin:0;padding:6px 12px;color:var(--dim);font-size:11px;
  background:var(--panel);border-bottom:1px solid var(--line);line-height:1.5}
.project-status:empty{display:none}
.project-status.error{color:#ffb4a9;background:var(--no-soft);border-bottom-color:var(--warn);font-weight:600}
.pixel-inspector{position:absolute;z-index:10;right:10px;top:10px;width:248px;
  max-width:calc(100% - 20px);max-height:calc(100% - 20px);overflow-y:auto;
  padding:12px;background:var(--panel);border:1px solid #3a4156;border-radius:8px;box-shadow:0 12px 30px #0009}
.inspector-header{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
.tile-palette{width:330px;padding:10px}
.palette-label{display:block;font-size:10px;color:var(--dim);margin:10px 0 4px}
#paletteSource,#paletteRow{width:100%}
.palette-filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.palette-filters select{flex:1;min-width:0;font-size:11px}
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;
  margin-top:8px;max-height:300px;overflow-y:auto;padding:3px}
.palette-grid button{padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font:9px var(--mono);position:relative}
.palette-grid button.unused{border-color:#766038}
.palette-grid button.unused::after{content:'';position:absolute;right:2px;top:2px;
  width:4px;height:4px;border-radius:50%;background:#f0c55a}
.tile-palette canvas{image-rendering:pixelated}
.palette-grid canvas{width:32px;height:32px}
.palette-zoom{position:fixed;z-index:19;pointer-events:none;width:154px;
  max-width:calc(100vw - 16px);padding:12px;background:var(--panel);
  border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px #000a;
  font:10px/1.5 var(--mono)}
.palette-zoom canvas{display:block;width:128px;height:128px;max-width:100%;image-rendering:pixelated}
.palette-zoom b{display:block;margin-top:8px}
.palette-zoom span{display:block;color:var(--dim)}
.palette-quarters{display:grid;grid-template-columns:repeat(2,40px);gap:2px;margin:7px auto;width:82px}
.palette-quarters button{padding:3px;line-height:0}
.palette-quarters canvas{width:32px;height:32px}
#paletteUseComposite{width:100%}
.palette-stamp{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);
  margin-top:10px;padding-top:8px;font-size:10px;color:var(--dim)}
#paletteStampPreview{width:64px;height:64px;flex:none;object-fit:contain}
.palette-stamp button{font-size:10px;padding:4px}
.face-art-palette{z-index:12}
.face-art-palette .palette-grid{max-height:190px}
.palette-face-pick,.palette-face-crop-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
.palette-face-pick button,.palette-face-crop-controls button{font-size:10px;padding:5px 7px}
.palette-face-pick label,.palette-face-crop-controls label{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.palette-face-pick select,.palette-face-crop-controls select{font-size:10px;padding:4px}
.palette-face-crop-controls input{width:38px;padding:4px}
.palette-face-samples{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px}
.palette-face-samples figure{margin:0;text-align:center;font:10px/1.5 var(--mono);color:var(--dim)}
.palette-face-samples figcaption{margin-top:4px}
.palette-face-source{position:relative;width:128px;height:128px}
#paletteFaceSource{display:block;width:128px;height:128px;cursor:crosshair}
#paletteFaceSource:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#paletteFaceCrop{position:absolute;border:2px solid #f0c55a;box-shadow:0 0 0 1px #171a22;box-sizing:border-box;pointer-events:none}
#paletteFacePreview{display:block;width:96px;height:96px}
#paletteFaceApply{margin-left:auto;border-color:var(--accent)}
#paletteFaceStatus{color:var(--ink)}
.palette-eyedropper{cursor:crosshair!important}
.palette-picking{position:absolute;left:12px;top:12px;z-index:14;display:flex;align-items:center;gap:10px;
  max-width:calc(100% - 24px);padding:8px 10px;border:1px solid var(--accent);border-radius:6px;
  background:var(--panel);box-shadow:0 5px 18px #0009;font-size:11px}
.palette-picking button{flex:none;font-size:10px}
#palettePickStamp{margin-top:6px}
#paletteFacePieceModeRow select{margin-top:5px;width:100%}
.spacer{flex:1}
h1{font-size:13px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:11px;color:var(--faint);margin:0 0 14px;line-height:1.5}
h2{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);margin:16px 0 7px;font-family:var(--mono)}
h2:first-of-type{margin-top:0}
.stack{display:flex;flex-direction:column;gap:5px}
.state{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;
  border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.state:hover{border-color:#3a4156}
.state.on{border-color:currentColor;background:#232838}
.swatch{width:11px;height:11px;border-radius:3px;background:currentColor;flex:none}
.state .n{color:var(--ink);font-weight:500}
.state .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.s-behind{color:var(--behind)} .s-plane{color:var(--plane)} .s-ahead{color:var(--ahead)}
.hint{font-size:11px;color:var(--faint);line-height:1.5;margin:7px 0 0}
kbd{font-family:var(--mono);font-size:10px;background:var(--sunk);
  border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--dim)}
code{font-family:var(--mono);font-size:10.5px;color:#bcd4f5}
.view{position:relative;flex:1;overflow:hidden;background:var(--sunk);min-height:0}
#map2d,#gl,#sharedGl{position:absolute;top:0;left:0;width:100%;height:100%}
#sharedGl{object-fit:contain;background:#000;touch-action:none}
#voxelOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#voxelOverlay polygon{fill:#54b9ff26;stroke:#8bd4ff;stroke-width:1.6;vector-effect:non-scaling-stroke}
#voxelOverlay line{stroke:#ffd265;stroke-width:2;vector-effect:non-scaling-stroke}
#voxelOverlay circle{fill:#ffd265;stroke:#352b11;stroke-width:2}
#voxelOverlay text{fill:#ffe2a0;font-size:12px;paint-order:stroke;stroke:#161616;stroke-width:3px}
.voxel-inspector{left:10px;right:auto;width:304px;font-size:11px;scroll-padding-bottom:64px}
.voxel-inspector summary,.voxel-inspector input,.voxel-inspector select,.voxel-inspector button{scroll-margin-bottom:12px}
.voxel-inspector fieldset{border:0;padding:0;margin:12px 0 8px;min-width:0}
.voxel-inspector legend{color:var(--accent);font-size:10px;font-weight:600;padding:0;margin-bottom:3px}
.voxel-inspector label{display:flex;align-items:center;gap:6px;justify-content:space-between;margin:7px 0}
.voxel-inspector input[type=number]{width:62px;flex:none;background:var(--sunk);border:1px solid var(--line);padding:4px}
.voxel-inspector input[type=range]{width:84px;min-width:40px;margin-left:auto}
.voxel-inspector select{max-width:180px;font-size:11px;min-width:0}
.voxel-inspector .hint{font-size:10px;line-height:1.5;color:var(--dim);margin:7px 0}
.voxel-inspector .hint:empty{display:none}
.voxel-preservation{font-size:9px;color:var(--dim);line-height:1.5;margin:6px 0 12px}
.voxel-selection{display:flex;flex-direction:column;gap:4px;margin-bottom:7px}
.voxel-selection span{font-size:10px;color:var(--dim)}
.voxel-inspector .voxel-depth-help{font-size:9px;margin:7px 0 10px}
.voxel-inspector details{border-top:1px solid var(--line);margin-top:0;padding:0}
.voxel-inspector details[open]{padding-bottom:8px}
.voxel-inspector summary{cursor:pointer;font-size:11px;padding:9px 0;color:var(--ink);line-height:1.4}
.voxel-inspector summary:hover{color:var(--accent)}
.voxel-inspector summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.voxel-inspector summary span{float:right;color:var(--dim);font-size:10px;max-width:120px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.voxel-inspector #voxelObjects{width:100%;max-width:100%}
#voxelDraft{color:#f0c55a;font-size:9px;text-align:right;border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.voxel-art{display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:7px;margin-top:8px}
.voxel-art b{flex:1}.voxel-art span{width:100%;font-size:10px;color:var(--dim);order:2}
.voxel-art button{font-size:10px;padding:4px 6px}
.voxel-actions{display:flex;gap:6px;margin-top:8px;position:sticky;bottom:-12px;background:var(--panel);padding:10px 0 8px;border-top:1px solid var(--line);z-index:1}
.voxel-actions button{padding:5px 8px}
#voxelApply{border-color:var(--accent)}
.voxel-check-grid,.voxel-coordinate-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.voxel-inspector .voxel-check,.voxel-check-grid label{justify-content:flex-start;gap:6px}
.voxel-coordinate-grid input[type=number]{width:52px}
.voxel-transform-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px}
.voxel-transform-grid label{flex-direction:column;align-items:flex-start;font-size:10px;gap:4px}
.voxel-transform-grid input[type=number]{width:100%;box-sizing:border-box}
.voxel-button-row{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.voxel-button-row button{font-size:10px;padding:5px 7px}
#voxelNavigate{width:100%;max-width:100%}

#voxelStatus{font-size:10px;line-height:1.5;color:var(--dim);margin:9px 0}#voxelStatus:empty{display:none}#voxelStatus.error{color:#ffb4a9}
#sharedControls[hidden],#baselineControls[hidden]{display:none}
#sharedControls input[type=number]{width:58px;background:var(--sunk);border:1px solid var(--line);padding:4px}
.shared-output-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sharedCustomSize{display:flex;align-items:center;gap:6px}
#sharedCustomSize input[type=number]{width:76px}
#sharedOutputSize{font-size:11px;color:var(--dim)}
#nativeFrameNumber{width:78px;background:var(--sunk);border:1px solid var(--line);padding:4px}
#pixelCanvas{display:block;width:100%;height:auto;margin:7px 0;image-rendering:pixelated;
  border:1px solid var(--line);cursor:crosshair;touch-action:none}
#map2d{cursor:crosshair;image-rendering:pixelated}
#map2d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tile-menu{position:fixed;z-index:20;width:260px;max-width:calc(100vw - 16px);
  max-height:calc(100vh - 16px);overflow-y:auto;background:var(--panel);
  border:1px solid #3a4156;border-radius:8px;padding:5px;
  box-shadow:0 12px 36px #0009}
.tile-menu[hidden]{display:none}
.tile-menu-title{font-size:11px;font-weight:600;padding:7px 8px;color:var(--dim)}
.tile-menu button{display:block;width:100%;text-align:left;background:transparent;
  border:1px solid transparent;padding:7px 8px;border-radius:4px}
.tile-menu button:hover,.tile-menu button:focus-visible{background:var(--accent-dim);
  border-color:var(--accent);outline:none}
.tile-menu button:disabled{background:transparent;border-color:transparent}
.tile-menu-separator{height:1px;background:var(--line);margin:4px 3px}
.tile-menu-note{font-size:10px;color:var(--faint);padding:7px 8px;line-height:1.4}
.tile-action-status{position:absolute;top:10px;left:10px;pointer-events:none;
  max-width:calc(100% - 20px);padding:6px 9px;border-radius:5px;
  background:rgba(13,15,20,.9);border:1px solid var(--line);color:var(--dim);font-size:11px}
.tile-action-status:empty{display:none}
#gl{display:none}
.legend{position:absolute;right:10px;bottom:10px;font-family:var(--mono);
  font-size:10px;color:var(--faint);background:rgba(13,15,20,.86);
  border:1px solid var(--line);border-radius:5px;padding:6px 9px;
  pointer-events:none;line-height:1.8;text-align:right;backdrop-filter:blur(6px)}
.legend b{color:var(--dim);font-weight:500}
.hud{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:10.5px;
  color:var(--dim);background:rgba(13,15,20,.86);border:1px solid var(--line);
  border-radius:5px;padding:6px 9px;pointer-events:none;line-height:1.7;
  backdrop-filter:blur(6px)}
.hud b{color:var(--ink);font-weight:600}
.hud.shared{top:10px;bottom:auto;max-width:calc(100% - 20px)}
.hud{display:none}.show-scene-info .hud{display:block}
.canvas-help{position:absolute;z-index:9;right:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #0005}
.canvas-help>summary{padding:7px 10px;font-size:11px;color:var(--dim);cursor:pointer;text-align:right}
.canvas-help .legend{position:static;pointer-events:auto;border:0;background:transparent;backdrop-filter:none;text-align:left;max-width:440px}
@media(max-width:1100px){
  .workspace-bar{gap:5px;padding:8px}
  .workspace-bar button,.workspace-bar .file-btn,.workspace-bar summary{padding-left:7px;padding-right:7px}
  .workspace-bar .save-state{max-width:100px;line-height:1.3}
  .selection-tools{padding:8px}.selection-detail{display:none}
}
@media(max-width:800px){
  .app{grid-template-columns:190px 1fr}.side{padding:10px}
  .workspace-bar>.spacer{display:none}
  .selection-summary #selectionScope{margin-left:0}
}
.tally{display:flex;gap:4px;margin-top:8px}
.tally div{flex:1;text-align:center;padding:5px 2px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--line)}
.tally .v{font-family:var(--mono);font-size:12px;font-weight:600;display:block}
.tally .l{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.ctl{display:flex;align-items:center;gap:7px;margin:0 0 5px}
.framing-guides{display:flex;gap:16px;margin:0 0 8px;font-size:12px}
.ctl label{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:12px}
.ctl input[type=range]{flex:1;min-width:0}
.ctl .v{font-family:var(--mono);font-size:10px;color:var(--dim);
  min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ladder{margin:8px 0 0;font-family:var(--mono);font-size:10px;line-height:1.65}
.ladder div{display:flex;gap:6px;align-items:center;padding:2px 5px;border-radius:3px}
.ladder .z{color:var(--faint);min-width:42px;font-variant-numeric:tabular-nums}
.ladder .nm{color:var(--dim);flex:1}
.ladder .clash{background:var(--no-soft,#3a1d1c);color:#ffb0a8}
.ladder .clash .nm,.ladder .clash .z{color:#ffb0a8}
.ladder .obj .nm{color:#ff8fa3}
.note{font-size:11px;line-height:1.55;color:var(--dim);background:var(--panel-2);
  border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:0 5px 5px 0;padding:8px 10px;margin:10px 0 0}
.note b{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:0;max-width:660px;width:calc(100vw - 48px);
  max-height:82vh;box-shadow:0 24px 64px -20px #000}
dialog::backdrop{background:rgba(8,9,12,.72)}
#settingsDlg{max-width:920px}
.settings-hint{padding:0 20px 12px;margin:0}
.settings-workspace{display:grid;grid-template-columns:220px minmax(0,1fr);max-height:60vh}
#settingsNav{padding:10px;overflow-y:auto;border-right:1px solid var(--line)}
#settingsNav button{display:block;width:100%;text-align:left;margin-bottom:5px}
#settingsContent{overflow-y:auto;min-width:0;max-height:none}
#settingsContent>.side-section{margin:0;padding:0;border:0}
#settingsContent>.side-section>summary{display:none}
#settingsContent select{max-width:100%}
#settingsContent .bg-policy .ctl label{min-width:105px}
@media(max-width:600px){
  .settings-workspace{grid-template-columns:1fr}
  #settingsNav{display:flex;gap:5px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  #settingsNav button{width:auto;flex:none;margin:0;font-size:11px}
  #settingsContent{max-height:45vh}
}
#exportDlg{max-width:920px}
#exportDlg .dlg-b{max-height:none;overflow:visible}
#exportDlg .spacer{flex:1}
.export-label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
#exportText{box-sizing:border-box;display:block;width:100%;height:42vh;min-height:120px;
  resize:vertical;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:5px;padding:12px;font:12px/1.6 var(--mono);tab-size:2}
.export-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
#exportCopy:not(:disabled){background:var(--accent-dim);border-color:var(--accent);color:#cfe4ff}
#exportText:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#exportStatus{margin:10px 0 0;min-height:1.65em}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:14px;font-weight:600}
.dlg-b{padding:16px 18px;overflow-y:auto;max-height:62vh;font-size:12.5px;line-height:1.65}
.dlg-b h4{font-size:11px;font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.08em;color:var(--faint);margin:18px 0 6px}
.dlg-b h4:first-child{margin-top:0}
.dlg-b p{margin:0 0 10px;color:var(--dim)}
.dlg-b b,.dlg-b strong{color:var(--ink);font-weight:600}
.dlg-b code{font-family:var(--mono);font-size:11px;background:var(--sunk);
  padding:1px 5px;border-radius:3px;color:#bcd4f5}
.dlg-b pre{background:var(--sunk);border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;overflow-x:auto;font-family:var(--mono);font-size:11px;
  line-height:1.6;color:#bcd4f5;margin:0 0 12px}
.dlg-b ul{margin:0 0 12px;padding-left:18px;color:var(--dim)}
.dlg-b li{margin:0 0 5px}
.dlg-b table{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 12px}
.dlg-b th,.dlg-b td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-soft)}
.dlg-b th{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--faint);font-weight:600}
.recipe-vector {display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;padding:8px;border-bottom:1px solid #39434d}
.recipe-vector strong {flex-basis:100%;font-size:12px}
.recipe-vector label {display:flex;flex-direction:column;gap:3px;font-size:11px}
.recipe-vector input[type=number] {width:100px;min-width:0;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px}
.recipe-vector label.recipe-component {flex-direction:row;align-items:center;gap:6px}
.recipe-vector input[type=checkbox] {width:auto}
#effectDefinitionControls {grid-column:1 / -1}
#effectDefinitionFields details {margin:10px 0}
</style>
