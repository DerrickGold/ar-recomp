# Deterministic boot settings paired with saves/aitos-eruption.rec.
#
# Aitos is the town that exercises the most of the background voxel renderer
# at once: authored models, mountain relief with silhouette skirts, the
# volcano and its crater anchor, and audited terrain with real relief. The
# voxel settings themselves are pinned in the checkpoint's env block rather
# than here, so the manifest shows the scene it renders.
save_backend = native-srm
save_edit_armed = Off
save_autobackup = Off
