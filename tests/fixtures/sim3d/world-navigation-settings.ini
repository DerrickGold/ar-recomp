# Visual navigation replays may use the boot/input sequence from sim-actions,
# but must retain the loaded save's actual progress and developed cell maps.
# sim-actions-settings.ini deliberately resets five towns to Act 1; using it
# here hides their live ground while stale structure records can remain.
save_backend = native-srm
save_edit_armed = Off
save_autobackup = Off
fix_bridge_limit = On
sim3d_world_navigation_clouds = On
